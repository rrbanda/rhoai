# RayJob manifest for distributed GRPO training via verl.
#
# Runs Group Relative Policy Optimization across a Ray cluster using
# the verl backend.  A head node coordinates the job while 4 GPU
# workers generate rollouts and run policy-gradient updates.
#
# Prerequisites:
#   - KubeRay operator installed on the RHOAI 3.4 cluster
#   - PVC "training-storage" provisioned with model weights and prompt data
#   - GPU quota available in the target namespace
#
# Apply:
#   oc apply -f rayjob_grpo.yaml -n distributed-training

apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: grpo-distributed
  namespace: distributed-training
  labels:
    app.kubernetes.io/name: grpo-distributed
    app.kubernetes.io/component: training
    app.kubernetes.io/part-of: training-hub
    training-hub.rhoai.io/algorithm: grpo
spec:
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 86400
  entrypoint: >-
    python -m training_hub.run lora_grpo
    --model-path /mnt/storage/models/Qwen/Qwen3-4B
    --data-path /mnt/storage/data/tool_call_traces.jsonl
    --ckpt-output-dir /mnt/storage/checkpoints/grpo
    --backend verl
    --lora-r 16
    --lora-alpha 8
    --num-iterations 15
    --group-size 8
    --prompt-batch-size 100
    --learning-rate 1e-5
  runtimeEnvYAML: |
    env_vars:
      NCCL_DEBUG: INFO
      NCCL_IB_DISABLE: "1"
      TRANSFORMERS_CACHE: /mnt/storage/cache
      HF_HOME: /mnt/storage/cache
  managedClusterConfig:
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grpo-distributed
            ray.io/node-type: head
        spec:
          containers:
            - name: ray-head
              image: quay.io/modh/training-hub:latest-ray
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              resources:
                requests:
                  cpu: "8"
                  memory: 32Gi
                limits:
                  cpu: "16"
                  memory: 64Gi
              volumeMounts:
                - name: training-storage
                  mountPath: /mnt/storage
          volumes:
            - name: training-storage
              persistentVolumeClaim:
                claimName: training-storage
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 4
        minReplicas: 4
        maxReplicas: 4
        rayStartParams:
          num-gpus: "2"
        template:
          metadata:
            labels:
              app.kubernetes.io/name: grpo-distributed
              ray.io/node-type: worker
          spec:
            containers:
              - name: ray-worker
                image: quay.io/modh/training-hub:latest-ray
                resources:
                  requests:
                    cpu: "8"
                    memory: 64Gi
                    nvidia.com/gpu: "2"
                  limits:
                    cpu: "16"
                    memory: 128Gi
                    nvidia.com/gpu: "2"
                volumeMounts:
                  - name: training-storage
                    mountPath: /mnt/storage
                  - name: dshm
                    mountPath: /dev/shm
            volumes:
              - name: training-storage
                persistentVolumeClaim:
                  claimName: training-storage
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 64Gi
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
