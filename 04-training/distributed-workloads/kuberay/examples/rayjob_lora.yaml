# RayJob manifest for distributed LoRA fine-tuning via Ray Train.
#
# Runs data-parallel LoRA/QLoRA across multiple GPU workers using
# Ray Train's TorchTrainer.  Each worker fine-tunes a local copy of
# the LoRA adapters while the base model weights stay frozen and
# sharded via DeepSpeed ZeRO-3.
#
# Prerequisites:
#   - KubeRay operator installed on the RHOAI 3.4 cluster
#   - PVC "training-storage" provisioned with model weights and data
#   - GPU quota available in the target namespace
#
# Apply:
#   oc apply -f rayjob_lora.yaml -n distributed-training

apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: lora-distributed
  namespace: distributed-training
  labels:
    app.kubernetes.io/name: lora-distributed
    app.kubernetes.io/component: training
    app.kubernetes.io/part-of: training-hub
    training-hub.rhoai.io/algorithm: lora
spec:
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 43200
  entrypoint: >-
    python -m training_hub.run lora_sft
    --model-path /mnt/storage/models/meta-llama/Llama-3.1-8B-Instruct
    --data-path /mnt/storage/data/training_data.jsonl
    --ckpt-output-dir /mnt/storage/checkpoints/lora
    --lora-r 16
    --lora-alpha 32
    --num-epochs 3
    --learning-rate 1e-4
    --max-seq-len 4096
  runtimeEnvYAML: |
    env_vars:
      NCCL_DEBUG: INFO
      NCCL_IB_DISABLE: "1"
      TRANSFORMERS_CACHE: /mnt/storage/cache
      HF_HOME: /mnt/storage/cache
  managedClusterConfig:
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lora-distributed
            ray.io/node-type: head
        spec:
          containers:
            - name: ray-head
              image: quay.io/modh/training-hub:latest-ray
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              resources:
                requests:
                  cpu: "4"
                  memory: 16Gi
                limits:
                  cpu: "8"
                  memory: 32Gi
              volumeMounts:
                - name: training-storage
                  mountPath: /mnt/storage
          volumes:
            - name: training-storage
              persistentVolumeClaim:
                claimName: training-storage
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 2
        minReplicas: 2
        maxReplicas: 4
        rayStartParams:
          num-gpus: "4"
        template:
          metadata:
            labels:
              app.kubernetes.io/name: lora-distributed
              ray.io/node-type: worker
          spec:
            containers:
              - name: ray-worker
                image: quay.io/modh/training-hub:latest-ray
                resources:
                  requests:
                    cpu: "16"
                    memory: 128Gi
                    nvidia.com/gpu: "4"
                  limits:
                    cpu: "32"
                    memory: 256Gi
                    nvidia.com/gpu: "4"
                volumeMounts:
                  - name: training-storage
                    mountPath: /mnt/storage
                  - name: dshm
                    mountPath: /dev/shm
            volumes:
              - name: training-storage
                persistentVolumeClaim:
                  claimName: training-storage
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 64Gi
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
