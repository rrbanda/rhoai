# TrainJob manifest for distributed Optimized SFT (OSFT).
#
# OSFT selectively unfreezes a fraction of model parameters via
# singular-value decomposition, reducing memory and training time
# compared to full-parameter SFT while retaining most quality.
#
# Key OSFT parameters configured here:
#   --unfreeze-rank-ratio 0.25 -- fraction of weight-matrix directions
#   --unmask-messages          -- compute loss over all message roles
#   --use-liger                -- enable Liger fused kernels for lower memory
#
# Prerequisites:
#   - Kubeflow Training Operator installed on the RHOAI 3.4 cluster
#   - training-hub ClusterTrainingRuntime exists:
#       oc get clustertrainingruntimes training-hub
#   - PVC "training-storage" provisioned with model weights and data
#   - GPU quota available in the target namespace
#
# Apply:
#   oc apply -f trainjob_osft.yaml -n distributed-training

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: osft-distributed
  namespace: distributed-training
  labels:
    app.kubernetes.io/name: osft-distributed
    app.kubernetes.io/component: training
    app.kubernetes.io/part-of: training-hub
    training-hub.rhoai.io/algorithm: osft
spec:
  suspend: false
  runtimeRef:
    name: training-hub
    kind: ClusterTrainingRuntime
  trainer:
    command:
      - torchrun
    args:
      - --nnodes=2
      - --nproc-per-node=4
      - --rdzv-backend=c10d
      - --rdzv-endpoint=$(MASTER_ADDR):$(MASTER_PORT)
      - -m
      - training_hub.run
      - osft
      - --model-path=$(MODEL_PATH)
      - --data-path=$(DATA_PATH)
      - --ckpt-output-dir=$(CHECKPOINT_DIR)
      - --unfreeze-rank-ratio=0.25
      - --num-epochs=3
      - --effective-batch-size=128
      - --learning-rate=5e-6
      - --max-seq-len=4096
      - --max-tokens-per-gpu=10000
      - --unmask-messages
      - --use-liger
      - --checkpoint-at-epoch
    env:
      - name: MODEL_PATH
        value: /mnt/storage/models/meta-llama/Llama-3.1-8B-Instruct
      - name: DATA_PATH
        value: /mnt/storage/data/training_data.jsonl
      - name: CHECKPOINT_DIR
        value: /mnt/storage/checkpoints/osft
      - name: NCCL_DEBUG
        value: INFO
      - name: NCCL_IB_DISABLE
        value: "1"
      - name: TRANSFORMERS_CACHE
        value: /mnt/storage/cache
      - name: HF_HOME
        value: /mnt/storage/cache
    numNodes: 2
    resourcesPerNode:
      requests:
        cpu: "16"
        memory: 128Gi
        nvidia.com/gpu: "4"
      limits:
        cpu: "32"
        memory: 256Gi
        nvidia.com/gpu: "4"
  podTemplateOverrides:
    - targetJobs:
        - name: node
      spec:
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        volumes:
          - name: training-storage
            persistentVolumeClaim:
              claimName: training-storage
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
        containers:
          - name: node
            volumeMounts:
              - name: training-storage
                mountPath: /mnt/storage
              - name: dshm
                mountPath: /dev/shm
