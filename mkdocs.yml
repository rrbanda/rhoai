site_name: RHOAI Guides
site_url: https://rrbanda.github.io/rhoai/
site_description: Hands-on guides for Red Hat OpenShift AI
repo_url: https://github.com/rrbanda/rhoai
repo_name: rrbanda/rhoai

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rrbanda/rhoai
    - icon: fontawesome/solid/book
      link: https://docs.redhat.com/en/documentation/red_hat_openshift_ai/latest
      name: Official RHOAI Docs
    - icon: fontawesome/solid/bug
      link: https://github.com/rrbanda/rhoai/issues/new
      name: Report an issue

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - index.md
  - Contributing: contributing.md
  - Model Customization:
    - Getting Started:
      - Overview: getting-started/overview.md
      - Setup & First Pipeline: getting-started/setup.md
      - Choosing an Algorithm: getting-started/choosing-an-algorithm.md
    - Pipelines (Try It):
      - Which Pipeline?: end-to-end/index.md
      - Tool-Calling Model: end-to-end/tool-calling-financial.md
      - Deep Agent (Agentic): end-to-end/deep-agent.md
      - Knowledge Tuning: end-to-end/knowledge-tuning.md
      - MCP Distillation (GRPO): end-to-end/mcp-distillation.md
    - Data Generation:
      - SDG Hub Overview: data-generation/index.md
      - Knowledge Tuning Data: data-generation/knowledge-tuning.md
      - Text Analysis: data-generation/text-analysis.md
    - Training:
      - Overview: training/index.md
      - SFT: training/sft.md
      - OSFT: training/osft.md
      - LoRA: training/lora.md
      - GRPO: training/grpo.md
      - LAB Multi-Phase: training/lab-multiphase.md
      - Continual Learning: training/continual-learning.md
      - Continued Pretraining: training/continued-pretraining.md
    - Serving:
      - Deploy & Serve: serving/index.md
    - Guardrails:
      - Safety & Compliance: guardrails/index.md
    - Evaluation:
      - Overview: evaluation/index.md
      - Benchmark Results: evaluation/benchmark-results.md
      - RAG Evaluation: evaluation/rag-evaluation.md
      - Code Evaluation: evaluation/code-evaluation.md
      - Tool-Use Evaluation: evaluation/agent-evaluation.md
    - Domains:
      - domains/index.md
      - Medical: domains/medical.md
      - Financial: domains/financial.md
      - Model-Specific Configs: domains/model-specific.md
    - Utilities:
      - utilities/index.md
      - Memory Estimator: utilities/memory-estimator.md
      - Plot Loss: utilities/plot-loss.md
      - Model Interpolation: utilities/model-interpolation.md
    - Reference:
      - reference/index.md
      - Data Formats: reference/data-formats.md
      - GPU Requirements: reference/gpu-requirements.md
      - Platform Reference: reference/platform-reference.md
