# vLLM ServingRuntime for KServe (RHOAI 3.4+)
#
# This runtime is preinstalled by RHOAI. Only apply this file if:
#   - You need a project-scoped runtime (not cluster-wide)
#   - You want to customize the vLLM container image or default args
#
# Check if it already exists:
#   oc get servingruntimes -n redhat-ods-applications | grep vllm
#
# Apply (only if needed):
#   oc apply -f 01-serving-runtime.yaml -n financial-agent
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "vLLM ServingRuntime for KServe"
    opendatahub.io/template-display-name: "vLLM ServingRuntime for KServe"
spec:
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: quay.io/modh/vllm:rhoai-2.20-cuda
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          port: 8080
          path: /health
        periodSeconds: 30
        failureThreshold: 24
      livenessProbe:
        httpGet:
          port: 8080
          path: /health
        periodSeconds: 100
        failureThreshold: 3
