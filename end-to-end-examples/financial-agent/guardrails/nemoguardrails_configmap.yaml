# ConfigMap for NeMo Guardrails on RHOAI 3.4+.
# Contains the config.yaml and rails.co files mounted into the guardrails server.
# Ref: https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.4/html/enabling_ai_safety_with_guardrails/deploying-nemo-guardrails_nemo-guardrails
#
# Usage:
#   1. Replace <model-predictor-svc>, <namespace>, and <served-model-name>
#   2. oc apply -f nemoguardrails_configmap.yaml
#   3. oc apply -f nemoguardrails_cr.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: financial-guardrails-config
  namespace: financial-agent  # Change to your namespace if different
data:
  config.yaml: |
    models:
      - type: main
        engine: openai
        parameters:
          openai_api_base: "http://<model-predictor-svc>.<namespace>.svc.cluster.local:8080/v1"
          model_name: "<served-model-name>"
    rails:
      config:
        sensitive_data_detection:
          input:
            entities:
              - EMAIL_ADDRESS
              - PERSON
              - PHONE_NUMBER
          output:
            entities:
              - PERSON
              - PHONE_NUMBER
        regex_detection:
          input:
            patterns:
              - "\\\\d{3}-\\\\d{2}-\\\\d{4}"
              - "ACCT-[0-9]{4,12}"
            case_insensitive: true
          output:
            patterns:
              - "\\\\d{3}-\\\\d{2}-\\\\d{4}"
              - "ACCT-[0-9]{4,12}"
            case_insensitive: true
      input:
        flows:
          - detect sensitive data on input
          - regex check input
      output:
        flows:
          - detect sensitive data on output
  rails.co: |
    # Using built-in rails for financial PII detection.
    # Add custom Colang flows here as needed (see config.co for examples).
