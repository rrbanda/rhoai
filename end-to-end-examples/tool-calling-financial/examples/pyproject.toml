[project]
name = "financial-deep-agent"
version = "0.1.0"
description = "Financial Insights Deep Agent — fine-tuned Qwen3-4B on RHOAI with 15 MCP tools"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
    "langchain>=1.3.12,<2.0.0",
    "langchain-openai>=0.3",
    "langgraph>=1.2.6",
    "langgraph-cli[inmem]>=0.4.30",
    "httpx>=0.28",
    "fastmcp>=2.0",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
