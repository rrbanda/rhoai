# OpenShift Route for the InferenceService (RawDeployment)
#
# KServe RawDeployment does not auto-create an external route.
# Apply this to expose the model endpoint outside the cluster.
#
# For LoRA adapter deployment:
#   oc apply -f 05-route.yaml -n tool-calling-financial
#
# For merged model deployment:
#   Change the service name to tool-calling-financial-merged-predictor
#
# Get the endpoint:
#   oc get route tool-calling-financial -n tool-calling-financial -o jsonpath='{.spec.host}'
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tool-calling-financial
  labels:
    opendatahub.io/dashboard: "true"
spec:
  to:
    kind: Service
    name: tool-calling-financial-lora-predictor
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
