# vLLM ServingRuntime with LoRA Support for KServe (RHOAI 3.4+)
#
# Serves a base model with LoRA adapter loaded from a PVC.
# Includes vLLM tool-calling support (Hermes parser).
#
# The training-workspace PVC must contain the LoRA adapter at /output.
#
# Check if a default vLLM runtime already exists:
#   oc get servingruntimes -n redhat-ods-applications | grep vllm
#
# Apply:
#   oc apply -f 01-serving-runtime.yaml -n tool-calling-financial
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-lora-runtime
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "vLLM LoRA Runtime for KServe"
spec:
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:5800e12b2a465f15961fcf34b645d79ed4f91ec9161eab22b1205d12682183c8
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        - --max-model-len=4096
        - --enable-lora
        - --lora-modules
        - tool-calling-financial=/mnt/lora-adapter/output
        - --max-lora-rank=16
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
        - --gpu-memory-utilization=0.90
      env:
        - name: HF_HUB_CACHE
          value: /tmp/hf_cache
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - name: lora-adapter
          mountPath: /mnt/lora-adapter
          readOnly: true
        - name: shm
          mountPath: /dev/shm
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  volumes:
    - name: lora-adapter
      persistentVolumeClaim:
        claimName: training-workspace
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
