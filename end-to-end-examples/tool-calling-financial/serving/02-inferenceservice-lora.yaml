# InferenceService — LoRA Adapter Serving (Recommended)
#
# Serves the base model (Qwen3-4B) from HuggingFace with the LoRA adapter
# loaded by the vllm-lora-runtime ServingRuntime.
#
# The ServingRuntime (01-serving-runtime.yaml) handles:
#   - LoRA adapter loading from the training-workspace PVC
#   - vLLM tool-calling flags (--enable-auto-tool-choice, --tool-call-parser hermes)
#   - GPU memory utilization and shared memory
#
# Prerequisites:
#   - KServe enabled in RHOAI (oc get dsc default-dsc)
#   - vllm-lora-runtime applied (01-serving-runtime.yaml)
#   - training-workspace PVC exists with adapter at /output (from Step 3)
#
# Apply:
#   oc apply -f 01-serving-runtime.yaml -n tool-calling-financial
#   oc apply -f 02-inferenceservice-lora.yaml -n tool-calling-financial
#
# Monitor:
#   oc get inferenceservice tool-calling-financial-lora -n tool-calling-financial -w
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: tool-calling-financial-lora
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-lora-runtime
      storageUri: hf://Qwen/Qwen3-4B
      resources:
        requests:
          cpu: "2"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "3"
          memory: "10Gi"
          nvidia.com/gpu: "1"
