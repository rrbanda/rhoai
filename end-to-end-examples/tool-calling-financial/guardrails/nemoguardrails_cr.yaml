# NemoGuardrails custom resource for the financial advisory agent.
# GA in RHOAI 3.4+.
# Ref: https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.4/html/ensuring_ai_safety_with_guardrails/deploying-nemo-guardrails_nemo-guardrails
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: tool-calling-financial-guardrails
  namespace: tool-calling-financial  # Change to your namespace if different
  labels:
    app.kubernetes.io/part-of: tool-calling-financial
spec:
  # Reference the ConfigMap(s) containing config.yaml + rails.co
  nemoConfigs:
    - name: tool-calling-financial
      default: true
      configMaps:
        - financial-guardrails-config
  env:
    # OPENAI_API_KEY is required by the NeMo Guardrails server even when
    # connecting to a local vLLM instance (vLLM accepts any value).
    - name: "OPENAI_API_KEY"
      value: "not-needed"
