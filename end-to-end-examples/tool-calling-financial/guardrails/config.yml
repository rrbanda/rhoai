# NeMo Guardrails configuration for the financial advisory agent.
# Deploys on RHOAI 3.4+ with GA guardrails support.
# See: https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.4/html/ensuring_ai_safety_with_guardrails
#
# This file is mounted into the NeMo Guardrails server as config.yaml
# via a Kubernetes ConfigMap referenced in the NemoGuardrails CR.
# When using the ConfigMap approach, embed this content under the
# `config.yaml` key (see nemoguardrails_configmap.yaml).

models:
  - type: main
    engine: openai
    parameters:
      # Points to the vLLM InferenceService deployed via KServe RawDeployment.
      # Use the cluster-internal service URL ending in /v1.
      openai_api_base: "http://<model-predictor-svc>.<namespace>.svc.cluster.local:8080/v1"
      model_name: "<served-model-name>"

rails:
  config:
    # Presidio-based PII entity detection (built-in)
    sensitive_data_detection:
      input:
        entities:
          - EMAIL_ADDRESS
          - PERSON
          - PHONE_NUMBER
      output:
        entities:
          - PERSON
          - PHONE_NUMBER
    # Regex-based detection for financial PII patterns
    regex_detection:
      input:
        patterns:
          - "\\d{3}-\\d{2}-\\d{4}"
          - "ACCT-[0-9]{4,12}"
        case_insensitive: true
      output:
        patterns:
          - "\\d{3}-\\d{2}-\\d{4}"
          - "ACCT-[0-9]{4,12}"
        case_insensitive: true

  input:
    flows:
      - detect sensitive data on input
      - regex check input

  output:
    flows:
      - detect sensitive data on output
