{% extends "main.html" %}

  <style>
    .md-header { position: initial; }

    .md-content__inner > h1 { display: none; }

    @media screen and (min-width: 60em) {
      .md-sidebar--secondary { display: none; }

  <section class="home-hero">

      <p class="hero-tagline">

      </p>
    </div>
  </section>

{% endblock %}

{% block content %}
  {{ super() }}
{% endblock %}
