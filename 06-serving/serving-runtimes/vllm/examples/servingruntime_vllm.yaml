# ServingRuntime — Custom vLLM runtime for RHOAI 3.4
#
# Configures vLLM as a serving runtime with tensor parallelism for
# multi-GPU deployment and continuous batching for maximum throughput.
# This runtime can be referenced by InferenceService resources via the
# `runtime` field.
#
# Apply:
#   oc apply -f servingruntime_vllm.yaml
#
# Verify:
#   oc get servingruntime vllm-runtime -n rhoai-serving
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  namespace: rhoai-serving
  labels:
    app.kubernetes.io/part-of: rhoai-serving
    app.kubernetes.io/managed-by: rhoai-examples
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "vLLM Runtime (Multi-GPU)"
    opendatahub.io/template-display-name: "vLLM ServingRuntime for KServe"
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
spec:
  supportedModelFormats:
    - name: vLLM
      version: "1"
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      image: quay.io/modh/vllm:rhoai-3.4
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name={{.Name}}"
        - "--tensor-parallel-size=4"
        - "--max-model-len=8192"
        - "--enable-prefix-caching"
        - "--dtype=bfloat16"
        - "--gpu-memory-utilization=0.90"
        - "--max-num-seqs=256"
        - "--enable-chunked-prefill"
        - "--trust-remote-code"
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "8"
          memory: 48Gi
          nvidia.com/gpu: "4"
        limits:
          cpu: "8"
          memory: 48Gi
          nvidia.com/gpu: "4"
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
